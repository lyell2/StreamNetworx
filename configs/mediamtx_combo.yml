externalAuthenticationURL: http://stream-control-service:5060/api/v1/auth
api: yes
apiAddress: :9997


srt: yes
srtAddress: :6000

paths:

  '~^live/(.+)$':
    source: publisher
    runOnReady: >
      ffmpeg -nostdin -re -i "srt://127.0.0.1:6000?streamid=read:live/$G1"
      -c:a libmp3lame -b:a 192k -ar 44100 -ac 2 -content_type audio/mpeg
      -f mp3 "icecast://source:__ICECAST_SOURCE_PASS__@127.0.0.1:8000/live/$G1.mp3"
    runOnReadyRestart: yes

  '~^mesh/(.+)$':
    source: srt://10.10.0.1:6000?streamid=read:live/$G1
    sourceOnDemand: yes
    runOnReady: >
      ffmpeg -nostdin -re -i "srt://127.0.0.1:6000?streamid=read:mesh/$G1"
      -c:a libmp3lame -b:a 192k -ar 44100 -ac 2 -content_type audio/mpeg
      -f mp3 "icecast://source:__ICECAST_SOURCE_PASS__@127.0.0.1:8000/live/$G1.mp3"
    runOnReadyRestart: yes


  all_others:
    runOnReady: ffmpeg -i rtsp://localhost:8554/$MTX_PATH -c:a copy -f mp3 icecast://source:__ICECAST_SOURCE_PASS__@localhost:8000/$MTX_PATH.mp3
    runOnReadyRestart: yes
