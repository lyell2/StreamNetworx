user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 16-Attribute StreamNetworx Disconnect JSON Schema
    # Edge Protection & Anti-Abuse Zones
    limit_conn_zone $arg_uid zone=sub_conn:10m;
    limit_req_zone $binary_remote_addr zone=stream_flood:10m rate=5r/s;

    # Territorial Licensing Map (Cloudflare CF-IPCountry header)
    map $http_cf_ipcountry $is_allowed_country {
        default 0;
        ""      1; # Local dev / direct testing allowed
        ZA      1; # South Africa
    }

    log_format streamnet_json escape=json '{'
        '"timestamp_ms": "$msec",'
        '"node_id": "sa-1-monitoring",'
        '"client_ip": "$remote_addr",'
        '"mount": "$uri",'
        '"status": $status,'
        '"bytes_sent": $bytes_sent,'
        '"duration": $request_time,'
        '"user_agent": "$http_user_agent",'
        '"referer": "$http_referer",'
        '"ssl_protocol": "$ssl_protocol",'
        '"ssl_cipher": "$ssl_cipher",'
        '"lid": "$arg_lid",'
        '"sid": "$arg_sid",
        "billable": "$arg_billable"'
    '}';

    server {
        listen 80;
        server_name _;

        # Health & Maintenance Draining Endpoint
        # Territorial Geo-Fenced Streaming (SAMRO / Territorial Licensing)
        location ~ ^/geo/(?<station_slug>[^/]+)\.mp3$ {
            if ($is_allowed_country = 0) {
                return 403 "Forbidden: Broadcast Restricted Outside South Africa (ZA)\n";
            }
            proxy_pass http://127.0.0.1:8000/$station_slug.mp3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        location = /healthz {
            access_log off;
            if (-f /var/streaming/drain.flag) {
                add_header Content-Type text/plain;
                return 503 "DRAINING\n";
            }
            default_type text/plain;
            return 200 "OK\n";
        }

        # Static Now-Playing JSON metadata endpoint
        location ~ ^/(?<station_slug>[a-zA-Z0-9_-]+)/nowplaying\.json$ {
            alias /var/www/metadata/$station_slug/nowplaying.json;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        # Premium / Syndicated Token-Gated Stream Delivery (Decision 15)
        # URL Format: /premium/<station>.mp3?md5=<token>&expires=<timestamp>
        location ~ ^/premium/(?<station_slug>[^/]+)\.mp3$ {
            secure_link $arg_md5,$arg_expires;
            secure_link_md5 "$arg_expires$station_slug secret_stream_key_99";

            if ($secure_link = "") {
                return 403 "Forbidden: Invalid or Missing Access Token
";
            }
            if ($secure_link = "0") {
                return 410 "Gone: Access Token Has Expired
";
            }

            limit_conn sub_conn 2;
            limit_conn_status 429;

            proxy_pass http://127.0.0.1:8000/$station_slug.mp3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 86400s;

            access_log syslog:server=vector:5140,facility=local7,tag=nginx streamnet_json;
        }

        # Public audio stream delivery
        location ~ ^/(?<station_path>[a-zA-Z0-9_-]+)\.mp3$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            tcp_nodelay on;

            access_log syslog:server=vector:5140,facility=local7,tag=nginx streamnet_json;
        }

                location /api/metadata {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
    }
}
