include /etc/nginx/modules-enabled/*.conf;
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $server_port $mesh_analytics_upstream {
        default __MESH_ANALYTICS_API_UPSTREAM__;
    }
    map $server_port $mesh_control_upstream {
        default __MESH_CONTROL_API_UPSTREAM__;
    }

    server {
        listen 5050;
        proxy_pass $mesh_analytics_upstream;
    }

    server {
        listen 5060;
        proxy_pass $mesh_control_upstream;
    }
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # StreamNetworx finalized listener-session event
    # Edge Protection & Anti-Abuse Zones
    limit_conn_zone $arg_uid zone=sub_conn:10m;
    limit_req_zone $binary_remote_addr zone=stream_flood:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=mesh_join:10m rate=6r/m;

    # Territorial Licensing Map (Cloudflare CF-IPCountry header)
    map $http_cf_ipcountry $is_allowed_country {
        default 0;
        ""      1; # Local dev / direct testing allowed
        ZA      1; # South Africa
    }

    log_format streamnet_json escape=json '{'
        '"timestamp_ms": "$msec",'
        '"node_id": "$hostname",'
        '"session_id": "$auth_session_id",'
        '"listener_id": "$auth_listener_id",'
        '"client_ip": "$remote_addr",'
        '"mount": "$uri",'
        '"status": $status,'
        '"bytes_sent": $bytes_sent,'
        '"duration": $request_time,'
        '"user_agent": "$http_user_agent",'
        '"referer": "$http_referer",'
        '"ssl_protocol": "$ssl_protocol",'
        '"ssl_cipher": "$ssl_cipher",'
        '"geo_country": "$geoip2_data_country_code",'
        '"geo_region": "$geoip2_data_region_name",'
        '"geo_city": "$geoip2_data_city_name",'
        '"asn": $geoip2_data_asn,'
        '"asn_org": "$geoip2_data_as_org",'
        '"billable": "$arg_billable"'
    '}';

geoip2 /etc/streaming/GeoLite2-City.mmdb {
    $geoip2_data_country_code default=XX source=$remote_addr country iso_code;
    $geoip2_data_region_name default=Unknown source=$remote_addr subdivisions 0 names en;
    $geoip2_data_city_name default=Unknown source=$remote_addr city names en;
}

geoip2 /etc/streaming/GeoLite2-ASN.mmdb {
    $geoip2_data_asn default=0 source=$remote_addr autonomous_system_number;
    $geoip2_data_as_org default=Unknown source=$remote_addr autonomous_system_organization;
}

    server {
        listen 80;
        listen 443 ssl;
        server_name stream.streammedia.org.za;

        ssl_certificate /etc/letsencrypt/live/stream.streammedia.org.za/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stream.streammedia.org.za/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:StreamTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Health & Maintenance Draining Endpoint
        # Territorial Geo-Fenced Streaming (SAMRO / Territorial Licensing)
        location /auth-verify {
            internal;
            proxy_pass http://stream-analytics-api:5050/api/v1/auth/verify$is_args$args;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/geo/(?<station_slug>[^/]+)\.mp3$ {
            auth_request /auth-verify;
            auth_request_set $auth_listener_id $upstream_http_x_listener_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;

            if ($is_allowed_country = 0) {
                return 403 "Forbidden: Broadcast Restricted Outside South Africa (ZA)\n";
            }
            proxy_pass http://127.0.0.1:8000/live/$station_slug.mp3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            access_log syslog:server=vector:5140,facility=local7,tag=nginx streamnet_json;

        }

        location = /healthz {
            access_log off;
            if (-f /var/streaming/drain.flag) {
                add_header Content-Type text/plain;
                return 503 "DRAINING\n";
            }
            default_type text/plain;
            return 200 "OK\n";
        }

        location = /mesh/join {
            limit_req zone=mesh_join burst=2 nodelay;
            proxy_pass http://127.0.0.1:9112/join;
            proxy_set_header Content-Length $content_length;
            proxy_read_timeout 5s;
        }

        location ~ ^/internal/mesh/(?<mesh_health_ip>10\.10\.0\.[0-9]+)/healthz$ {
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://$mesh_health_ip:5050/healthz;
            proxy_set_header X-Mesh-Secret $http_x_mesh_secret;
            proxy_read_timeout 3s;
        }

        location ~ ^/internal/mesh/(?<mesh_peer_ip>10\.10\.0\.[0-9]+)/metrics/summary$ {
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://$mesh_peer_ip:5050/internal/metrics/summary$is_args$args;
            proxy_set_header X-Mesh-Secret $http_x_mesh_secret;
            proxy_set_header Content-Type application/json;
            proxy_read_timeout 5s;
        }

        location ~ ^/internal/mesh/(?<mesh_control_ip>10\.10\.0\.[0-9]+)/control/stations/snapshot$ {
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://$mesh_control_ip:5060/internal/stations/snapshot;
            proxy_set_header X-Mesh-Secret $http_x_mesh_secret;
            proxy_read_timeout 5s;
        }

        location ~ ^/internal/mesh/(?<mesh_control_ip>10\.10\.0\.[0-9]+)/control/stations/snapshot$ {
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://$mesh_control_ip:5060/internal/stations/snapshot;
            proxy_set_header X-Mesh-Secret $http_x_mesh_secret;
            proxy_read_timeout 5s;
        }

        # Static Now-Playing JSON metadata endpoint
        location ~ ^/(?<station_slug>[a-zA-Z0-9_-]+)/nowplaying\.json$ {
            alias /var/www/metadata/$station_slug/nowplaying.json;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        # Customer Portal Analytics & Reporting API
        location /api/v1/analytics/ {
            proxy_pass http://stream-analytics-api:5050/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location = /api/v1/control/api/v1/auth {
            return 404;
        }

        location /api/v1/control/ {
            proxy_pass http://stream-control-service:5060/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
        }

        # Premium / Syndicated Token-Gated Stream Delivery (Decision 15)
        # URL Format: /premium/<station>.mp3?md5=<token>&expires=<timestamp>
        location ~ ^/premium/(?<station_slug>[^/]+)\.mp3$ {
            secure_link $arg_md5,$arg_expires;
            secure_link_md5 "$arg_expires$station_slug __HMAC_SECRET_KEY__";

            if ($secure_link = "") {
                return 403 "Forbidden: Invalid or Missing Access Token
";
            }
            if ($secure_link = "0") {
                return 410 "Gone: Access Token Has Expired
";
            }

            limit_conn sub_conn 2;
            limit_conn_status 429;

            proxy_pass http://127.0.0.1:8000/live/$station_slug.mp3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;

            proxy_read_timeout 86400s;

            access_log syslog:server=vector:5140,facility=local7,tag=nginx streamnet_json;
        }


        # Internal subrequest for Token Validation & Connect Telemetry
        location = /internal/auth/listener {
            internal;
            proxy_pass http://stream-analytics-api:5050/webhook/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Agent $http_user_agent;
            proxy_read_timeout 2s;
        }

        # Public & Legacy audio stream delivery
        location ~ ^/(live/)?(?<station_path>[a-zA-Z0-9_-]+)\.mp3$ {
            # Subrequest to FastAPI to validate token
            auth_request /internal/auth/listener;

            # Extract rich UUID/Session variables from the auth response headers
            auth_request_set $auth_listener_id $upstream_http_x_user_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;

            proxy_read_timeout 86400s;
            tcp_nodelay on;

            # Fire structured JSON telemetry to Vector on disconnect
            access_log syslog:server=vector:5140,facility=local7,tag=nginx streamnet_json;
        }
location /api/metadata {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;

        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;

        }
    }
}
